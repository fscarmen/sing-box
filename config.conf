# 使用说明 / Usage:
# 1. 复制此文件并重命名为 config.conf / Copy this file and rename it to config.conf
# 2. 根据需要修改配置参数 / Modify the configuration parameters as needed
# 3. 执行安装命令 / Run the installation command:
#    bash <(wget -qO- https://raw.githubusercontent.com/fscarmen/sing-box/main/sing-box.sh) -f config.conf

# 配置文件说明 / Configuration Description:

# 语言选项 / Language option: 
# c 为中文 / c for Chinese
# e 为英文 / e for English
# 交互安装留空时询问；非交互快速安装默认英文
# Interactive install asks when empty; non-interactive install defaults to English
LANGUAGE=''

# 协议选择 / Protocol selection: 
# a 为全部协议，也可以选择 b-n 的任意组合
# a for all protocols, or choose any combination from b-n
# 留空默认全部 / Leave empty for all protocols
# b: VLESS + Reality
# c: Hysteria2
# d: Tuic V5
# e: ShadowTLS
# f: Shadowsocks
# g: Trojan
# h: VMESS + WebSocket
# i: VLESS + WebSocket + TLS
# j: VLESS + H2 + Reality
# k: VLESS + gRPC + Reality
# l: AnyTLS
# m: NaiveProxy
# n: Snell v6
CHOOSE_PROTOCOLS=''

# 起始端口号，其他协议会依次递增；留空默认 8881
# Starting port number; leave empty for the default 8881
START_PORT=''

# Nginx 端口号，用于订阅、WebSocket 和 Argo
# 交互安装留空时询问；非交互快速安装自动选择空闲端口
# Interactive install asks when empty; non-interactive install selects a random free port
PORT_NGINX=''

# 服务器 IP 地址，支持 IPv4 或 IPv6；留空自动探测，无法确定时交互安装会询问
# Server IP address; leave empty for auto-detection, interactive install asks when it cannot be determined
SERVER_IP=''

# CDN 域名，用于优化线路；留空使用默认域名
# CDN domain name; leave empty for the default domain
CDN=''

# UUID，用于节点识别和认证；留空随机生成
# UUID for node identification and authentication; leave empty for a random UUID
UUID_CONFIRM=''

# 是否启用订阅功能 / Enable subscription function:
# true=启用（留空默认），false=禁用，dynamic=启用并安装后立即开启动态订阅
# true=on (empty default), false=off, dynamic=on AND enable dynamic subscription right after install
# 别名 / Aliases: y/yes/1=true，n/no/0=false（大小写不敏感 / case-insensitive）
# 显式设置会被尊重；dynamic 失败时仅警告，不阻塞安装 / Explicit values are respected; dynamic failure only warns
SUBSCRIBE=''

# 是否启用 Argo 隧道 / Enable Argo Tunnel: true, false, or leave empty
# 非交互快速安装留空时，选择 WS 协议（h/i）自动启用，否则禁用
# In non-interactive install, leave empty to auto-enable it for WS protocols (h/i), otherwise disable it
# 如果为 true，则使用 Argo Tunnel 回源，固定域名需要填写 ARGO_DOMAIN 与 ARGO_AUTH，临时隧道无需填写
# If true, use Argo Tunnel for origin connection. For fixed domain, fill in ARGO_DOMAIN and ARGO_AUTH. For temporary tunnel, leave them empty
# 如果为 false，则需要填写 VMESS_HOST_DOMAIN 和 VLESS_HOST_DOMAIN
# If false, fill in VMESS_HOST_DOMAIN and VLESS_HOST_DOMAIN
ARGO=''

# VMESS + WebSocket 域名配置，当 ARGO='false' 且选择 h 协议时必填
# 交互安装留空时询问；非交互安装缺失时直接报错
# Interactive install asks when empty; non-interactive install fails if missing
VMESS_HOST_DOMAIN=''

# VLESS + WebSocket + TLS 域名配置，当 ARGO='false' 且选择 i 协议时必填
# 交互安装留空时询问；非交互安装缺失时直接报错
# Interactive install asks when empty; non-interactive install fails if missing
VLESS_HOST_DOMAIN=''

# Argo 域名设置，当 ARGO='true' 时必填，如果使用临时隧道，则无需填写
# Argo domain settings, required when ARGO='true'. Leave empty if using temporary tunnel
ARGO_DOMAIN=''

# Argo 认证信息，可以是 Json，Token 和 API 方式；ARGO_DOMAIN 留空时无需填写
# Argo authentication information can be provided as JSON, Token, or API credentials; not required when ARGO_DOMAIN is empty
# 固定域名缺少认证时，交互安装会询问；非交互安装回退临时隧道
# With a fixed domain and missing auth, interactive install asks; non-interactive install falls back to a quick tunnel
ARGO_AUTH=''

# 端口跳跃范围，用于 Hysteria2 协议，格式为 起始端口:结束端口；留空禁用
# Port hopping range for Hysteria2 protocol, format: start_port:end_port
PORT_HOPPING_RANGE=''

# 是否启用 Hysteria2 Realm / Enable Hysteria2 Realm: true or false; leave empty to disable
# 适用于回国或者没有公网入口的机器；有公网入口时不建议使用
# Useful for China-back routing or machines without public inbound access; not recommended when the server already has a public inbound IP/port
HY2_REALM=''

# Reality 的私钥，留空则调用 generate_reality_keypair 随机生成公私钥
# Reality private key. Random generation if left empty
REALITY_PRIVATE=''

# 节点名称，支持 emoji 表情
# Node name, emoji supported
NODE_NAME_CONFIRM=''

# 指定网络出口，绑定到指定网卡 / Bind network interface to a specific network adapter
# 例如 / e.g. BIND_INTERFACE=eth0
# 留空则不指定 / Leave empty to not specify
BIND_INTERFACE=''
